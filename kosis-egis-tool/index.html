<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOSIS → eGIS 시군구 변환기</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#223;max-width:850px;margin:30px auto;padding:16px}section{background:white;padding:22px;border-radius:14px;margin:15px 0;border:1px solid #dbe4ef}label{display:block;margin:12px 0 4px}input,select{padding:10px;width:100%;box-sizing:border-box}button{background:#245e95;border:0;color:white;border-radius:8px;padding:12px;margin:9px 5px 0 0;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#eef3f9;padding:12px;border-radius:8px}</style><h1>KOSIS → eGIS 시군구 변환기</h1><p>기준 시군구 CSV와 KOSIS 통계자료를 비교하여 결합용 CSV를 생성합니다. 인증키는 이 화면에 입력하지 않습니다.</p><section><h2>1. 기준 시군구 CSV</h2><input id="baseFile" type="file" accept=".csv"><label>기준표 지역명 열</label><select id="baseName"></select><label>기준표 코드 열 (선택)</label><select id="baseCode"></select></section><section><h2>2. 통계자료</h2><label>KOSIS 통계 CSV 업로드</label><input id="statsFile" type="file" accept=".csv"><details><summary>또는 KOSIS API로 조회하기 (Worker 배포 후)</summary><label>Worker URL</label><input id="workerUrl" placeholder="https://your-worker.workers.dev"><label>기관 ID(orgId)</label><input id="orgId"><label>통계표 ID(tblId)</label><input id="tblId"><label>분류 1(objL1)</label><input id="objL1"><label>항목 코드(itmId)</label><input id="itmId"><label>주기(prdSe)</label><select id="prdSe"><option value="Y">연간</option><option value="Q">분기</option><option value="M">월간</option></select><label>시작 연도/시점</label><input id="startPrdDe" value="2025"><label>종료 연도/시점</label><input id="endPrdDe" value="2025"><button id="fetchBtn">API 조회</button></details><label>통계 지역명 열</label><select id="statsName"></select><label>통계 코드 열 (선택)</label><select id="statsCode"></select><label>통계값 열</label><select id="statsValue"></select><label>결합 기준</label><select id="matchMode"><option value="name">지역명 일치</option><option value="code">코드 일치(동일 코드체계만)</option></select><button id="mergeBtn">시군구 대조·변환</button></section><section><h2>3. 결과</h2><pre id="status">CSV를 업로드하세요.</pre><button id="downloadBtn" disabled>eGIS CSV 다운로드</button><button id="issuesBtn" disabled>검증 결과 다운로드</button><pre id="preview"></pre></section><p>252개는 사용자의 기준표 목표 행 수입니다. 행정구역 개편 및 서로 다른 통계연도의 경계를 확인하세요.</p><script src="./app.js"></script></html>
