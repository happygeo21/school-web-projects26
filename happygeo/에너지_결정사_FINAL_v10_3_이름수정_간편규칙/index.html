<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에너지 결정사 FINAL v10</title><style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#17213a;--muted:#667086;--line:#dfe4ee;--pri:#6258e8;--pri2:#ff6d93;--good:#20a36c;--warn:#e5a11a;--bad:#de5368;--blue:#258ee8;--shadow:0 10px 26px rgba(30,39,70,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.65}a{text-decoration:none;color:inherit}button,input,select{font:inherit}button{cursor:pointer}

.wrap{max-width:1180px;margin:auto;padding:48px 20px}.section-title{font-size:clamp(29px,4vw,46px);line-height:1.16;margin:0 0 8px}.sub{color:var(--muted);font-size:17px;margin:0 0 22px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.callout{background:#fff0f4;border:1px solid #ffcbd9;border-left:5px solid var(--pri2);border-radius:18px;padding:16px}.key{background:#ecf9f3;border-color:#c9ebdb}.warn{background:#fff7e8;border-color:#ffe1a2}.blue{background:#eef6ff;border-color:#d5e7ff}
.join{margin-top:-32px;position:relative}.join-grid{display:grid;grid-template-columns:1.4fr .6fr;gap:16px}@media(max-width:800px){.join-grid{grid-template-columns:1fr}}.fields{display:flex;flex-wrap:wrap;gap:8px}.fields input,.fields select{min-height:44px;border:1px solid #ccd4e2;background:#fff;border-radius:12px;padding:9px 11px}.statusline{margin-top:10px;font-size:14px}.online{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 9px;border-radius:999px;background:#eaf8f1;color:#17774f}.dot{width:8px;height:8px;border-radius:50%;background:#28b47a}
.lesson-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.lesson-no{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),#928af6);color:#fff;font-size:24px;font-weight:900}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#efedff;color:#4e46cb;font-size:12px;font-weight:800;margin:3px}
.gallery{display:flex;gap:12px;overflow:auto;padding:4px 1px 12px}.source-card{min-width:260px;max-width:260px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.source-card img{display:block;width:100%;height:330px;object-fit:cover;object-position:top}.source-card p{margin:0;padding:10px 12px;font-size:12px;color:#5e6679}.source-card b{color:#232d46}
.themebar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.themebar button{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 13px;font-weight:800}.themebar button.active{background:#262a4b;color:#fff;border-color:#262a4b}.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}.profile{overflow:hidden;padding:0;transition:.15s}.profile:hover{transform:translateY(-2px)}.profile img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-bottom:1px solid var(--line)}.profile-body{padding:13px}.profile-name{font-size:21px;font-weight:900}.profile-line{font-size:13px;color:#616b80;min-height:42px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{padding:4px 7px;border-radius:999px;background:#f4f2f8;font-size:10px;font-weight:800}.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.profile-actions button{border:0;border-radius:11px;padding:8px;font-size:12px;font-weight:800}.heart{background:#fff0f4;color:#d43c6b}.detail{background:#efedff;color:#5248d1}
.missions{display:grid;gap:12px}.mission{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px}.mission-top{display:flex;gap:10px;align-items:flex-start}.mission-no{min-width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#eae8ff;color:#5047c9;font-weight:900}.mission-q{font-weight:900;font-size:17px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px;margin-top:12px}.option{border:1px solid #dfe3eb;background:#fff;border-radius:12px;padding:10px;text-align:left}.option:hover{background:#f8f8fc}.option.correct{border-color:#7ad7b1;background:#edf9f3}.option.wrong{border-color:#ff9cad;background:#fff0f3}.feedback{font-size:13px;color:#667086;margin-top:8px}.lesson-score{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:14px;padding:14px;border:1px solid #e2defc;background:#f7f5ff;border-radius:18px}.score-num{font-size:30px;font-weight:900;color:#5147cb}.progressbar{height:8px;border-radius:999px;background:#e8e9ef;overflow:hidden}.progressbar>div{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));width:0}

footer{text-align:center;color:#7b8292;padding:36px 20px}.hidden{display:none}
