name: GeoTeacher Telegram Gateway Tests

on:
  pull_request:
    paths:
      - "tools/telegram-office/gateway/**"
      - ".github/workflows/teacher-telegram-gateway-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run gateway and webhook safety tests
        working-directory: tools/telegram-office/gateway
        run: npm test

