name: GeoTeacher Telegram Gateway Tests

on:
  pull_request:
    paths:
      - "tools/telegram-office/gateway/**"
      - ".github/workflows/teacher-telegram-gateway-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run gateway and webhook safety tests
        working-directory: tools/telegram-office/gateway
        run: npm test

      - name: One-time owner-approved 0% candidate smoke (GET + anonymous POST only)
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/geoteacher-zero-smoke-20261104' && github.event.pull_request.head.repo.full_name == 'happygeo21/school-web-projects26'
        working-directory: tools/telegram-office/gateway
        run: python scripts/zero_smoke_once.py

      - name: Build the disabled production candidate without uploading
        working-directory: tools/telegram-office/gateway
        env:
          WRANGLER_SEND_METRICS: 'false'
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
        run: npx --yes wrangler@4.157.0 deploy --dry-run --config wrangler.production-candidate.toml --outdir "${{ runner.temp }}/geoteacher-candidate"
