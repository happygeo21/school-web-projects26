name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-skipped-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare allowlisted public files
        run: node scripts/build-public-site.mjs

      - name: Verify public files before uploading
        run: node scripts/verify-public-site.mjs

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
