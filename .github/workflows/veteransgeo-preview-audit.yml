name: PR 7 preview safety audit (read-only)
on:
  push:
    branches: [codex/veteransgeo-upgrade]
    paths: ['veteransgeo/security/audit-preview.mjs', '.github/workflows/veteransgeo-preview-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node veteransgeo/security/audit-preview.mjs
