name: GeoTeacher Telegram Notifications

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pair a new bot, send a test, or scan sources"
        required: true
        type: choice
        default: test
        options:
          - pair
          - test
          - scan
  schedule:
    # Weekdays 16:50 KST (07:50 UTC), separate from Notion morning alert.
    - cron: "50 7 * * 1-5"

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Telegram office notifier
        env:
          MODE: ${{ github.event.inputs.mode || 'scan' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_WATCH_PAGES: ${{ vars.NOTION_WATCH_PAGES }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$MODE" = "scan" ] && { [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; }; then
            echo "Bot not yet configured; scheduled scan skipped."
            exit 0
          fi
          python tools/telegram-office/main.py "$MODE"
