name: Check public site before deployment

on:
  pull_request:
    paths:
      - 'wedding-planner/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/security-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the public login boundary
        run: node --test scripts/public-boundary.test.mjs
      - name: Build public files without deploying
        run: node scripts/build-public-site.mjs
      - name: Check exact public artifact and local references
        run: node scripts/verify-public-site.mjs
