name: Veteransgeo public source preflight (no deployment)
on:
  push:
    branches: [codex/veteransgeo-upgrade]
    paths: ['veteransgeo/security/probe-official.mjs', '.github/workflows/veteransgeo-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node veteransgeo/security/probe-official.mjs
